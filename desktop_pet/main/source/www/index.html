<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>桌宠 · SD 文件管理</title>
<style>
:root{--bg:#0f1419;--surface:#1a2332;--surface2:#243044;--border:#2d3a4d;--text:#e8eef7;--muted:#8b9cb3;--accent:#3d8bfd;--danger:#e85d6c;--ok:#3dd68c;--radius:12px;--font:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#0a0e14,#121a24 50%,#0f1419);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
.top{margin-bottom:16px}.top h1{font-size:1.4rem;margin:0 0 6px;font-weight:700}.top p{margin:0;color:var(--muted);font-size:.9rem}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.nav a,.btn{display:inline-block;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);text-decoration:none;font-size:.9rem;cursor:pointer}
.nav a:hover,.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-danger{background:#3a1f26;border-color:var(--danger);color:#ffb4bc}
.btn-ghost{background:transparent}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.crumb{font-size:.85rem;color:var(--muted);word-break:break-all;margin-bottom:10px}
.crumb a{color:var(--accent);text-decoration:none}
.status{font-size:.85rem;color:var(--muted);margin-bottom:10px}.status.err{color:var(--danger)}.status.ok{color:var(--ok)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.toolbar input[type=text]{flex:1;min-width:120px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)}
.toolbar input[type=file]{max-width:100%;color:var(--muted);font-size:.85rem}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
th{color:var(--muted);font-weight:600;font-size:.8rem}tr:last-child td{border-bottom:0}
.name{color:var(--text)}.name a{color:var(--text);text-decoration:none}.name a:hover{color:var(--accent)}
.badge{display:inline-block;font-size:.7rem;padding:2px 6px;border-radius:4px;background:var(--surface2);color:var(--muted);margin-right:6px}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px}
h2{font-weight:650;font-size:1rem;margin:0 0 8px}
details.card>summary{cursor:pointer;list-style:none;font-weight:650;font-size:1rem}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:" ▾";color:var(--muted);font-weight:400}
details.card[open]>summary::after{content:" ▴"}
.hint{font-size:.82rem;color:var(--muted);margin:0 0 10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>SD 卡文件管理</h1>
    <p>浏览 / 上传 / 下载 / 新建目录 / 删除。文件名限英文、数字、<code>._-~</code>（单文件 ≤ 8MB）。上传字库后请<strong>重启设备</strong>。</p>
  </div>
  <div class="nav">
    <a href="#/">SD 根目录</a>
    <a href="#/pet">pet/</a>
    <a href="#/pet/font">字库 font/</a>
    <a href="#/record">录音</a>
    <button type="button" class="btn" id="btnRefresh">刷新</button>
    <a href="/provision">Wi‑Fi</a>
    <a href="/ota">OTA</a>
  </div>

  <div class="card">
    <div class="crumb" id="crumb">/sdcard</div>
    <div class="toolbar">
      <input type="file" id="upFile" multiple>
      <button type="button" class="btn btn-accent" id="btnUpload">上传到此目录</button>
      <input type="text" id="mkdirName" placeholder="新目录名" maxlength="64">
      <button type="button" class="btn" id="btnMkdir">新建目录</button>
    </div>
    <div class="bar" id="upBar"><i id="upFill"></i></div>
    <div class="status" id="status">加载中…</div>
    <div id="list"></div>
  </div>

  <details class="card">
    <summary>上传皮肤包（pet.zip）</summary>
    <p class="hint">覆盖 <code>/sdcard/pet/</code> 后自动重启；不会改卡根 <code>config</code>。</p>
    <div class="actions" style="justify-content:flex-start;margin-bottom:8px">
      <input type="file" id="skinFile" accept=".zip,application/zip">
      <button type="button" class="btn btn-accent" id="btnSkin">上传并重启</button>
    </div>
    <div class="bar" id="skinBar"><i id="skinFill"></i></div>
    <div class="status" id="skinStatus"></div>
  </details>

  <details class="card">
    <summary>触摸校准</summary>
    <p class="hint">先确认 Needs=上 / Dock=下，点中央后三轮×四向共 12 点。长按 GPIO0 也可开始。</p>
    <div class="actions" style="justify-content:flex-start;margin-bottom:8px">
      <button type="button" class="btn btn-accent" id="btnCalib">开始校准</button>
      <button type="button" class="btn btn-danger" id="btnCalibReset">清除校准</button>
    </div>
    <div class="status" id="calibStatus"></div>
  </details>
</div>
<script>
(function(){
  var statusEl=document.getElementById('status');
  var listEl=document.getElementById('list');
  var crumbEl=document.getElementById('crumb');
  var upFill=document.getElementById('upFill');
  var upBusy=false;

  function pathFromHash(){
    var h=(location.hash||'#/').replace(/^#\/?/,'');
    return decodeURIComponent(h).replace(/^\/+|\/+$/g,'');
  }
  function setStatus(t,cls){statusEl.className='status'+(cls?' '+cls:'');statusEl.textContent=t;}
  function fmtBytes(n){
    n=+n||0;if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(2)+' MB';
  }
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];});}
  function joinPath(base,name){return base?base+'/'+name:name;}
  function fileUrl(path){return '/api/sd/file?path='+encodeURIComponent(path);}
  function nameOk(name){return /^[A-Za-z0-9._~-]{1,120}$/.test(name)&&name[0]!=='.';}

  function renderCrumb(path){
    var parts=path?path.split('/'):[];
    var html='<a href="#/">/sdcard</a>';
    var acc='';
    for(var i=0;i<parts.length;i++){
      acc=acc?(acc+'/'+parts[i]):parts[i];
      html+=' / <a href="#/'+acc+'">'+esc(parts[i])+'</a>';
    }
    crumbEl.innerHTML=html;
  }

  async function downloadFile(path,name){
    setStatus('下载中: '+name+' …');
    try{
      var r=await fetch(fileUrl(path),{cache:'no-store'});
      if(!r.ok){
        var msg='HTTP '+r.status;
        try{var j=await r.json();if(j&&j.error)msg=j.error;}catch(e){}
        setStatus('下载失败: '+msg,'err');
        return;
      }
      var blob=await r.blob();
      var url=URL.createObjectURL(blob);
      var a=document.createElement('a');
      a.href=url;a.download=name||'download.bin';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},2000);
      setStatus('已开始下载: '+name,'ok');
    }catch(e){setStatus('下载失败: '+e.message,'err');}
  }

  async function loadList(){
    var path=pathFromHash();
    renderCrumb(path);
    setStatus('加载中…');
    listEl.innerHTML='';
    try{
      var url='/api/sd/list'+(path?('?path='+encodeURIComponent(path)):'');
      var r=await fetch(url,{cache:'no-store'});
      var j=await r.json();
      if(!j.ok){setStatus('失败: '+(j.error||r.status),'err');return;}
      setStatus('当前 /sdcard'+(path?'/'+path:'')+' · 共 '+(j.files?j.files.length:0)+' 项','ok');
      if(!j.files||!j.files.length){listEl.innerHTML='<div class="empty">目录为空</div>';return;}
      var rows='<table><thead><tr><th>名称</th><th>大小</th><th></th></tr></thead><tbody>';
      j.files.forEach(function(f){
        var full=joinPath(path,f.name);
        var nameCell,actions='';
        if(f.kind==='dir'){
          nameCell='<span class="badge">DIR</span><a href="#/'+full+'">'+esc(f.name)+'/</a>';
          actions='<button type="button" class="btn btn-danger" data-del="'+esc(full)+'" data-kind="dir">删除空目录</button>';
        }else{
          nameCell='<span class="badge">FILE</span>'+esc(f.name);
          actions=
            '<button type="button" class="btn btn-accent" data-dl="'+esc(full)+'" data-name="'+esc(f.name)+'">下载</button>'+
            '<button type="button" class="btn btn-danger" data-del="'+esc(full)+'" data-kind="file">删除</button>';
        }
        rows+='<tr><td class="name">'+nameCell+'</td><td>'+(f.kind==='dir'?'—':fmtBytes(f.bytes))+'</td><td class="actions">'+actions+'</td></tr>';
      });
      rows+='</tbody></table>';
      listEl.innerHTML=rows;
      listEl.querySelectorAll('[data-dl]').forEach(function(btn){
        btn.addEventListener('click',function(){downloadFile(btn.getAttribute('data-dl'),btn.getAttribute('data-name'));});
      });
      listEl.querySelectorAll('[data-del]').forEach(function(btn){
        btn.addEventListener('click',function(){delPath(btn.getAttribute('data-del'),btn.getAttribute('data-kind'));});
      });
    }catch(e){setStatus('请求失败: '+e.message,'err');}
  }

  async function delPath(path,kind){
    var tip=kind==='dir'?('删除空目录 '+path+' ?'):('删除文件 '+path+' ?');
    if(!path||!confirm(tip))return;
    setStatus('删除中…');
    try{
      var r=await fetch('/api/sd/delete?path='+encodeURIComponent(path),{method:'POST'});
      var j=await r.json();
      if(!j.ok){setStatus('删除失败: '+(j.error||r.status)+(j.error==='rmdir'?'（目录非空？）':''),'err');return;}
      setStatus('已删除','ok');
      loadList();
    }catch(e){setStatus('删除失败: '+e.message,'err');}
  }

  async function mkdirHere(){
    var name=(document.getElementById('mkdirName').value||'').trim();
    if(!nameOk(name)){setStatus('目录名非法（仅 A-Z a-z 0-9 ._-~）','err');return;}
    var path=joinPath(pathFromHash(),name);
    setStatus('创建目录…');
    try{
      var r=await fetch('/api/sd/mkdir?path='+encodeURIComponent(path),{method:'POST'});
      var j=await r.json();
      if(!j.ok){setStatus('创建失败: '+(j.error||r.status),'err');return;}
      document.getElementById('mkdirName').value='';
      setStatus('已创建 '+path,'ok');
      location.hash='#/'+path;
    }catch(e){setStatus('创建失败: '+e.message,'err');}
  }

  function uploadOne(file,dir){
    return new Promise(function(resolve){
      if(!nameOk(file.name)){resolve({ok:false,error:'bad_name',name:file.name});return;}
      var dest=joinPath(dir,file.name);
      var xhr=new XMLHttpRequest();
      xhr.open('POST','/api/sd/upload?path='+encodeURIComponent(dest));
      xhr.setRequestHeader('Content-Type','application/octet-stream');
      xhr.upload.onprogress=function(e){
        if(e.lengthComputable&&e.total){upFill.style.width=Math.round(e.loaded*100/e.total)+'%';}
      };
      xhr.onreadystatechange=function(){
        if(xhr.readyState!==4)return;
        var j=null;try{j=JSON.parse(xhr.responseText);}catch(e){}
        if(xhr.status===200&&j&&j.ok){resolve({ok:true,name:file.name,bytes:j.bytes});}
        else{resolve({ok:false,error:(j&&j.error)||('HTTP '+xhr.status),name:file.name});}
      };
      xhr.onerror=function(){resolve({ok:false,error:'network',name:file.name});};
      xhr.send(file);
    });
  }

  async function uploadHere(){
    var fi=document.getElementById('upFile');
    var files=fi.files?Array.prototype.slice.call(fi.files):[];
    if(!files.length){setStatus('请先选择文件','err');return;}
    if(upBusy)return;
    upBusy=true;
    document.getElementById('btnUpload').disabled=true;
    var dir=pathFromHash();
    var ok=0,fail=0;
    for(var i=0;i<files.length;i++){
      upFill.style.width='0';
      setStatus('上传 ('+(i+1)+'/'+files.length+'): '+files[i].name+' ('+fmtBytes(files[i].size)+') …');
      var res=await uploadOne(files[i],dir);
      if(res.ok){ok++;}else{fail++;setStatus('失败 '+res.name+': '+res.error,'err');}
    }
    upBusy=false;
    document.getElementById('btnUpload').disabled=false;
    fi.value='';
    upFill.style.width=fail?upFill.style.width:'100%';
    if(fail===0){setStatus('上传完成 '+ok+' 个文件','ok');loadList();}
    else{setStatus('完成：成功 '+ok+'，失败 '+fail,'err');loadList();}
  }

  document.getElementById('btnRefresh').addEventListener('click',loadList);
  document.getElementById('btnMkdir').addEventListener('click',mkdirHere);
  document.getElementById('btnUpload').addEventListener('click',uploadHere);
  document.getElementById('mkdirName').addEventListener('keydown',function(e){if(e.key==='Enter')mkdirHere();});
  window.addEventListener('hashchange',loadList);

  (function skinUpload(){
    var fi=document.getElementById('skinFile');
    var btn=document.getElementById('btnSkin');
    var fill=document.getElementById('skinFill');
    var st=document.getElementById('skinStatus');
    function msg(t,cls){st.className='status'+(cls?' '+cls:'');st.textContent=t;}
    btn.addEventListener('click',function(){
      var file=fi.files&&fi.files[0];
      if(!file){msg('请选择 .zip 皮肤包','err');return;}
      btn.disabled=true;fill.style.width='0';
      msg('上传中 '+file.name+' ('+fmtBytes(file.size)+') …');
      var xhr=new XMLHttpRequest();
      xhr.open('POST','/api/pet/skin');
      xhr.setRequestHeader('Content-Type','application/zip');
      xhr.upload.onprogress=function(e){if(e.lengthComputable&&e.total){fill.style.width=Math.round(e.loaded*100/e.total)+'%';}};
      xhr.onreadystatechange=function(){
        if(xhr.readyState!==4)return;
        btn.disabled=false;
        var j=null;try{j=JSON.parse(xhr.responseText);}catch(e){}
        if(xhr.status===200&&j&&j.ok){fill.style.width='100%';msg('已写入，设备即将重启。请稍候刷新本页。','ok');return;}
        msg('失败: '+(j&&j.error?j.error:('HTTP '+xhr.status)),'err');
      };
      xhr.onerror=function(){btn.disabled=false;msg('网络错误','err');};
      xhr.send(file);
    });
  })();

  (function touchCalib(){
    var st=document.getElementById('calibStatus');
    var btn=document.getElementById('btnCalib');
    var btnReset=document.getElementById('btnCalibReset');
    var pollT=null;
    function msg(t,cls){st.className='status'+(cls?' '+cls:'');st.textContent=t;}
    function stopPoll(){if(pollT){clearInterval(pollT);pollT=null;}}
    async function refresh(){
      try{
        var r=await fetch('/api/touch/calib',{cache:'no-store'});
        var j=await r.json();
        if(!j||!j.ok){msg('状态失败','err');return j;}
        if(j.running){msg('请点屏幕十字 '+(j.step+1)+'/'+j.steps,'ok');}
        else{stopPoll();msg(j.saved?'已保存到 NVS':'未校准（1:1）',j.saved?'ok':'');}
        return j;
      }catch(e){msg('请求失败: '+e.message,'err');return null;}
    }
    btn.addEventListener('click',async function(){
      btn.disabled=true;msg('正在启动…');
      try{
        var r=await fetch('/api/touch/calib/start',{method:'POST'});
        var j=await r.json();
        if(!j||!j.ok){msg('启动失败: '+(j&&j.error?j.error:('HTTP '+r.status)),'err');return;}
        msg('请点屏幕十字 1/'+(j.steps||4),'ok');
        stopPoll();pollT=setInterval(refresh,500);
      }catch(e){msg('启动失败: '+e.message,'err');}
      finally{btn.disabled=false;}
    });
    btnReset.addEventListener('click',async function(){
      if(!confirm('清除已保存的触摸校准？'))return;
      btnReset.disabled=true;
      try{
        var r=await fetch('/api/touch/calib/reset',{method:'POST'});
        var j=await r.json();
        if(!j||!j.ok){msg('清除失败','err');return;}
        stopPoll();msg('已清除，恢复 1:1','ok');
      }catch(e){msg('清除失败: '+e.message,'err');}
      finally{btnReset.disabled=false;}
    });
    refresh();
  })();

  if(!location.hash)location.hash='#/';
  else loadList();
})();
</script>
</body>
</html>
