<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wi‑Fi 配网</title>
<style>
:root{--bg:#0f1419;--surface:#1a2332;--surface2:#243044;--border:#2d3a4d;--text:#e8eef7;--muted:#8b9cb3;--accent:#3d8bfd;--danger:#e85d6c;--ok:#3dd68c;--radius:12px;--font:system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(160deg,#0a0e14,#121a24 50%,#0f1419);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.35rem;margin:0 0 6px}p.sub{margin:0 0 16px;color:var(--muted);font-size:.9rem}
.nav{margin-bottom:14px}.nav a{color:var(--accent);text-decoration:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.btn{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.9rem;cursor:pointer}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-danger{background:#3a1f26;border-color:var(--danger);color:#ffb4bc}
.field{margin:10px 0}label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text)}
.status,.hint,#s{font-size:.85rem;color:var(--muted)}
.ap{display:flex;justify-content:space-between;gap:8px;padding:8px 6px;border-bottom:1px solid var(--border);cursor:pointer}
.ap:hover{color:var(--accent)}
.log{white-space:pre-wrap;font-size:.8rem;color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav"><a href="/">← 返回</a></div>
  <h1>Wi‑Fi 配网</h1>
  <p class="sub">扫描并保存路由器。SoftAP 时请连设备热点后打开 <code>http://192.168.4.1/provision</code>。</p>
  <div class="card">
    <div class="row">
      <button type="button" class="btn" id="btnSt">刷新状态</button>
      <button type="button" class="btn btn-accent" id="btnScan">扫描附近网络</button>
    </div>
    <div class="status" id="st">加载中…</div>
    <p id="s"></p>
    <div id="list"></div>
    <div class="field"><label for="ssid">网络名称 (SSID)</label><input id="ssid" autocomplete="off"></div>
    <div class="field"><label for="pw">密码（开放网络可留空）</label><input id="pw" type="password" autocomplete="off"></div>
    <div class="row">
      <button type="button" class="btn btn-accent" id="btnSave">保存并重启</button>
    </div>
    <p class="hint">保存后设备会用新凭据连路由器并重启。</p>
    <pre class="log" id="log"></pre>
    <div class="field">
      <p class="hint">清除已存路由器并重启进入设备热点配网。</p>
      <button type="button" class="btn btn-danger" id="btnClr">清除已存 Wi‑Fi 并重启</button>
    </div>
  </div>
</div>
<script>
function $(id){return document.getElementById(id);}
function log(t){$('log').textContent=t||'';}
async function refresh(){
  try{
    var r=await fetch('/api/wifi/status'); var j=await r.json();
    $('st').textContent='mode='+j.mode+' ip='+j.ip+' sta_has_ip='+j.sta_has_ip+' softap='+j.softap;
  }catch(e){$('st').textContent='状态失败: '+e;}
}
async function doScan(){
  $('s').textContent='正在扫描…'; $('list').innerHTML='';
  try{
    await fetch('/api/wifi/scan',{method:'POST'});
    for(var i=0;i<40;i++){
      var r=await fetch('/api/wifi/scan_result'); var j=await r.json();
      if(j.pending){await new Promise(function(x){setTimeout(x,250);}); continue;}
      var aps=j.aps||[];
      $('s').textContent=aps.length?('找到 '+aps.length+' 个，点一行填入 SSID'):'未发现网络';
      aps.forEach(function(a){
        var row=document.createElement('div'); row.className='ap';
        row.textContent=a.ssid+'  ch'+a.ch+'  '+a.rssi+' dBm';
        row.onclick=function(){$('ssid').value=a.ssid;};
        $('list').appendChild(row);
      });
      break;
    }
  }catch(e){$('s').textContent='扫描失败: '+e;}
}
async function doSave(){
  log('提交中…');
  try{
    var body=JSON.stringify({ssid:$('ssid').value,password:$('pw').value});
    var r=await fetch('/api/wifi/save',{method:'POST',headers:{'Content-Type':'application/json'},body:body});
    log(r.status+' '+await r.text());
  }catch(e){log(String(e));}
}
async function doClr(){
  if(!confirm('清除已存 Wi‑Fi 并重启？')) return;
  log('清除中…');
  try{
    var r=await fetch('/api/wifi/sta_disconnect',{method:'POST'});
    log(r.status+' '+await r.text());
  }catch(e){log(String(e));}
}
$('btnSt').onclick=refresh; $('btnScan').onclick=doScan; $('btnSave').onclick=doSave; $('btnClr').onclick=doClr;
refresh();
</script>
</body>
</html>
