<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>desktop_pet · 五官方案评审（可爱向）</title>
<style>
  :root {
    --bg: #161018;
    --panel: #241c2a;
    --ink: #fff4fa;
    --muted: #b09aac;
    --accent: #ff9ec8;
    --accent2: #b8a0ff;
    --line: #47384c;
    --screen-bg: #202020;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font: 14px/1.45 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(820px 460px at 8% -8%, #5a2a48 0%, transparent 55%),
      radial-gradient(720px 420px at 100% 0%, #3a2a68 0%, transparent 52%),
      var(--bg);
  }
  .wrap {
    display: grid;
    grid-template-columns: minmax(310px, 400px) 1fr;
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
    padding: 22px 18px 48px;
  }
  @media (max-width: 920px) { .wrap { grid-template-columns: 1fr; } }
  h1 { margin: 0 0 6px; font-size: 20px; font-weight: 750; }
  .sub { color: var(--muted); margin: 0 0 14px; font-size: 13px; }
  .panel {
    background: color-mix(in srgb, var(--panel) 94%, black);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .panel h2 {
    margin: 0 0 10px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, label.file, select {
    appearance: none;
    border: 1px solid var(--line);
    background: #18121c;
    color: var(--ink);
    border-radius: 8px;
    padding: 8px 12px;
    font: inherit;
    cursor: pointer;
  }
  button:hover, label.file:hover, select:hover { border-color: #6a4a62; }
  button.active {
    border-color: var(--accent);
    background: linear-gradient(135deg, #ff9ec8, #c4a0ff);
    color: #2a1020;
    font-weight: 750;
  }
  label.file input { display: none; }
  .scheme {
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    display: grid;
    gap: 4px;
  }
  .scheme .name { font-weight: 700; }
  .scheme .desc { font-size: 12px; color: var(--muted); }
  .scheme .swatch { display: flex; gap: 6px; margin-top: 4px; }
  .scheme .swatch i {
    width: 14px; height: 14px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
  }
  label.sl {
    display: grid;
    grid-template-columns: 92px 1fr 42px;
    gap: 8px;
    align-items: center;
    margin: 5px 0;
    font-size: 12px;
    color: var(--muted);
  }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  input[type="color"] {
    width: 34px; height: 28px; border: none; padding: 0;
    background: transparent; cursor: pointer;
  }
  .meta {
    font-size: 12px;
    color: var(--muted);
    white-space: pre-wrap;
    background: #120e16;
    border-radius: 8px;
    padding: 10px;
    border: 1px solid var(--line);
  }
  .notes { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .notes li { margin: 4px 0; }
  .notes code {
    font: 12px ui-monospace, Consolas, monospace;
    color: #ffc8e0;
    background: #120e16;
    padding: 1px 5px;
    border-radius: 4px;
  }
  .hint {
    margin-top: 8px;
    font-size: 12px;
    color: var(--accent2);
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .device {
    width: min(92vw, 430px);
    aspect-ratio: 1;
    border-radius: 50%;
    background: #0b0910;
    padding: 18px;
    box-shadow: 0 0 0 10px #1a1520, 0 0 0 14px #47384c, 0 28px 60px rgba(0,0,0,.45);
  }
  .screen {
    width: 100%; height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: var(--screen-bg);
    position: relative;
    cursor: grab;
    touch-action: none;
  }
  .screen.dragging { cursor: grabbing; }
  canvas#view { width: 100%; height: 100%; display: block; }
  .chosen {
    border: 1px dashed var(--accent);
    border-radius: 10px;
    padding: 8px 12px;
    color: var(--muted);
    font-size: 13px;
    max-width: 430px;
    text-align: center;
  }
  .drag-tools .chip {
    font-size: 12px;
    padding: 6px 10px;
  }
  .drag-tools .chip.active {
    background: #3a2040;
    border-color: var(--accent2);
    color: #fff;
  }
</style>
</head>
<body>
<div class="wrap">
  <aside>
    <h1>五官方案评审 · 可爱向</h1>
    <p class="sub">粉色猫耳娘 · 蓝紫眼。可拖动五官位置；嘴巴做成猫唇 / 弯笑，重点可爱与灵动。</p>

    <div class="panel">
      <h2>1. 身体图</h2>
      <div class="row">
        <label class="file">上传无五官 PNG
          <input id="file" type="file" accept="image/png,image/webp,image/jpeg" />
        </label>
        <button type="button" id="btnClear">清除图</button>
      </div>
    </div>

    <div class="panel">
      <h2>2. 可爱方案</h2>
      <div id="schemes" class="row" style="flex-direction:column;align-items:stretch"></div>
    </div>

    <div class="panel">
      <h2>3. 位置（眼 / 嘴都可自由移动）</h2>
      <p class="hint">在圆屏上<strong>点住哪个就拖哪个</strong>（左眼 / 右眼 / 嘴巴）。也可滑条微调。</p>
      <div class="row" style="margin-bottom:8px">
        <label style="color:var(--muted);font-size:12px"><input id="linkEyes" type="checkbox" checked /> 双眼联动（拖一眼另一眼跟移）</label>
        <button type="button" id="btnResetPos">复位位置</button>
      </div>
      <label class="sl">左眼 X <input id="eyeLX" type="range" min="20" max="140" /><span id="eyeLXv"></span></label>
      <label class="sl">左眼 Y <input id="eyeLY" type="range" min="30" max="120" /><span id="eyeLYv"></span></label>
      <label class="sl">右眼 X <input id="eyeRX" type="range" min="20" max="140" /><span id="eyeRXv"></span></label>
      <label class="sl">右眼 Y <input id="eyeRY" type="range" min="30" max="120" /><span id="eyeRYv"></span></label>
      <label class="sl">嘴巴 X <input id="mouthX" type="range" min="30" max="130" /><span id="mouthXv"></span></label>
      <label class="sl">嘴巴 Y <input id="mouthY" type="range" min="60" max="145" /><span id="mouthYv"></span></label>
      <label class="sl">腮红 Y <input id="blushY" type="range" min="50" max="130" /><span id="blushYv"></span></label>
    </div>

    <div class="panel">
      <h2>4. 大小 / 嘴巴造型</h2>
      <label class="sl">眼宽 <input id="eyeW" type="range" min="12" max="36" /><span id="eyeWv"></span></label>
      <label class="sl">眼高 <input id="eyeH" type="range" min="8" max="32" /><span id="eyeHv"></span></label>
      <label class="sl">瞳孔 <input id="pupil" type="range" min="4" max="16" /><span id="pupilv"></span></label>
      <label class="sl">嘴宽 <input id="mouthW" type="range" min="10" max="40" /><span id="mouthWv"></span></label>
      <label class="sl">嘴高 <input id="mouthH" type="range" min="4" max="18" /><span id="mouthHv"></span></label>
      <label class="sl">腮红 <input id="blush" type="range" min="0" max="18" /><span id="blushv"></span></label>
      <div class="row" style="margin-top:8px">
        <span style="color:var(--muted);font-size:12px">嘴型</span>
        <select id="mouthStyle">
          <option value="cat_w">猫唇 ω（最可爱）</option>
          <option value="soft_smile">弯弯笑</option>
          <option value="heart">小心心唇</option>
          <option value="dot">小圆点</option>
          <option value="ellipse">椭圆（旧）</option>
        </select>
      </div>
      <div class="row" style="margin-top:8px">
        <span style="color:var(--muted);font-size:12px">眼白</span>
        <input id="cEye" type="color" />
        <span style="color:var(--muted);font-size:12px">瞳</span>
        <input id="cPupil" type="color" />
        <span style="color:var(--muted);font-size:12px">嘴</span>
        <input id="cMouth" type="color" />
        <span style="color:var(--muted);font-size:12px">腮</span>
        <input id="cBlush" type="color" />
      </div>
      <div class="row" style="margin-top:10px">
        <label style="color:var(--muted);font-size:12px">表情
          <select id="faceMood">
            <option value="idle">idle</option>
            <option value="happy">happy</option>
            <option value="sad">sad</option>
            <option value="sleepy">sleepy</option>
            <option value="hungry">hungry</option>
            <option value="angry">angry</option>
          </select>
        </label>
        <label style="color:var(--muted);font-size:12px"><input id="anim" type="checkbox" checked /> 呼吸/眨眼</label>
        <label style="color:var(--muted);font-size:12px"><input id="sparkle" type="checkbox" checked /> 眼神光</label>
        <label style="color:var(--muted);font-size:12px"><input id="brows" type="checkbox" /> 眉</label>
      </div>
    </div>

    <div class="panel">
      <h2>5. 选定</h2>
      <div class="row" style="margin-bottom:8px">
        <button type="button" id="btnPick" class="active">选定当前方案</button>
        <button type="button" id="btnCopy">复制 JSON</button>
      </div>
      <pre class="meta" id="out">尚未选定</pre>
    </div>

    <div class="panel">
      <h2>说明</h2>
      <ul class="notes">
        <li>拖动位置 ≈ 之后在 <code>pet_skin</code> 标的锚点手感。</li>
        <li>嘴型以「猫唇 ω / 弯笑」为主；椭圆仅作对照。</li>
        <li>回主预览：<a href="index.html" style="color:var(--accent2)">index.html</a></li>
      </ul>
    </div>
  </aside>

  <main class="stage">
    <div class="device"><div class="screen" id="screen"><canvas id="view" width="240" height="240"></canvas></div></div>
    <div class="chosen" id="chosenLabel">点住左眼 / 右眼 / 嘴巴即可拖动 · 上传无脸图后对比更准</div>
  </main>
</div>

<script>
(() => {
  const BODY = 160;
  const SCREEN = 240;
  const BODY_OY = -6;

  const SCHEMES = [
    {
      id: "neko_omega",
      name: "猫唇紫瞳",
      desc: "ω 猫嘴 + 双高光蓝紫瞳 + 轻腮红，默认最可爱。",
      eyeW: 22, eyeH: 23, eyeGap: 38, pupil: 10,
      mouthW: 22, mouthH: 10, blush: 10,
      eyeY: 72, mouthY: 108, blushY: 96,
      mouthStyle: "cat_w",
      cEye: "#fff7fc", cPupil: "#7a5cff", cMouth: "#ff7fad", cBlush: "#ff9eb8",
      brow: false,
    },
    {
      id: "peach_curve",
      name: "蜜桃弯笑",
      desc: "弯弯笑唇 + 圆眼；喂食/开心时更甜。",
      eyeW: 21, eyeH: 22, eyeGap: 37, pupil: 9,
      mouthW: 26, mouthH: 11, blush: 12,
      eyeY: 70, mouthY: 110, blushY: 94,
      mouthStyle: "soft_smile",
      cEye: "#fff8fc", cPupil: "#8a6dff", cMouth: "#ff8fb8", cBlush: "#ffb0c8",
      brow: false,
    },
    {
      id: "heart_kiss",
      name: "小心心唇",
      desc: "迷你心形嘴，偏卖萌/戳一戳。",
      eyeW: 20, eyeH: 21, eyeGap: 36, pupil: 9,
      mouthW: 16, mouthH: 12, blush: 11,
      eyeY: 71, mouthY: 109, blushY: 95,
      mouthStyle: "heart",
      cEye: "#fff6fb", cPupil: "#6b5cff", cMouth: "#ff6f9c", cBlush: "#ff9ab5",
      brow: false,
    },
    {
      id: "bluebell_soft",
      name: "蓝铃软眼",
      desc: "瞳偏蓝铃紫，嘴用小圆点，干净软萌。",
      eyeW: 20, eyeH: 18, eyeGap: 39, pupil: 8,
      mouthW: 12, mouthH: 8, blush: 8,
      eyeY: 73, mouthY: 107, blushY: 97,
      mouthStyle: "dot",
      cEye: "#eef6ff", cPupil: "#5f7dff", cMouth: "#f28aaa", cBlush: "#ffb4c8",
      brow: false,
    },
    {
      id: "firmware_ref",
      name: "固件对照",
      desc: "旧椭圆嘴 + 白眼，只作对比。",
      eyeW: 18, eyeH: 22, eyeGap: 36, pupil: 8,
      mouthW: 28, mouthH: 8, blush: 0,
      eyeY: 72, mouthY: 108, blushY: 96,
      mouthStyle: "ellipse",
      cEye: "#ffffff", cPupil: "#202028", cMouth: "#e07080", cBlush: "#ff9eb8",
      brow: false,
    },
  ];

  const el = (id) => document.getElementById(id);
  const canvas = el("view");
  const screen = el("screen");
  const ctx = canvas.getContext("2d");

  let bodyImg = null;
  let schemeId = SCHEMES[0].id;
  let picked = null;
  let dragTarget = "eyes";
  let dragging = false;
  let t0 = performance.now();
  let blinkPhase = 0;

  const state = { ...SCHEMES[0] };

  const SLIDERS = [
    ["eyeW", "eyeWv"], ["eyeH", "eyeHv"], ["eyeGap", "eyeGapv"], ["pupil", "pupilv"],
    ["mouthW", "mouthWv"], ["mouthH", "mouthHv"], ["blush", "blushv"],
    ["eyeY", "eyeYv"], ["mouthY", "mouthYv"], ["blushY", "blushYv"],
  ];

  function bodyOrigin() {
    return {
      ox: (SCREEN - BODY) / 2,
      oy: (SCREEN - BODY) / 2 + BODY_OY,
    };
  }

  function syncUI() {
    for (const [k, v] of SLIDERS) {
      if (!el(k)) continue;
      el(k).value = state[k];
      el(v).textContent = String(state[k]);
    }
    el("cEye").value = state.cEye;
    el("cPupil").value = state.cPupil;
    el("cMouth").value = state.cMouth;
    el("cBlush").value = state.cBlush;
    el("mouthStyle").value = state.mouthStyle;
    el("brows").checked = !!state.brow;
  }

  function readUI() {
    for (const [k] of SLIDERS) state[k] = +el(k).value;
    state.cEye = el("cEye").value;
    state.cPupil = el("cPupil").value;
    state.cMouth = el("cMouth").value;
    state.cBlush = el("cBlush").value;
    state.mouthStyle = el("mouthStyle").value;
    state.brow = el("brows").checked;
    syncUI();
  }

  function applyScheme(s) {
    schemeId = s.id;
    Object.assign(state, {
      eyeW: s.eyeW, eyeH: s.eyeH, eyeGap: s.eyeGap, pupil: s.pupil,
      mouthW: s.mouthW, mouthH: s.mouthH, blush: s.blush,
      eyeY: s.eyeY, mouthY: s.mouthY, blushY: s.blushY,
      mouthStyle: s.mouthStyle,
      cEye: s.cEye, cPupil: s.cPupil, cMouth: s.cMouth, cBlush: s.cBlush,
      brow: s.brow,
    });
    syncUI();
    document.querySelectorAll(".scheme").forEach((b) => {
      b.classList.toggle("active", b.dataset.id === s.id);
    });
    el("chosenLabel").textContent = `预览：${s.name} · 圆屏拖动可改位置`;
  }

  function moodMods(mood, bob) {
    let eyeH = state.eyeH;
    let mouthW = state.mouthW;
    let mouthH = state.mouthH;
    let pupilDy = 0;
    let showBrow = state.brow;
    let mouth = state.cMouth;
    let style = state.mouthStyle;
    if (mood === "happy") {
      mouthW += 4; mouthH += 2; style = style === "ellipse" ? "soft_smile" : style;
    } else if (mood === "sad") {
      mouthW = Math.max(10, mouthW - 4); pupilDy = 2; style = "dot";
    } else if (mood === "sleepy") {
      eyeH = Math.max(4, Math.round(eyeH * 0.3));
      style = "dot";
    } else if (mood === "hungry") {
      style = "ellipse"; mouthW = Math.max(12, mouthW - 4); mouthH += 4; mouth = "#ff5f8a";
    } else if (mood === "angry") {
      showBrow = true; style = "dot";
    }
    // auto blink pulse
    if (el("anim").checked && mood !== "sleepy") {
      const cycle = (performance.now() - t0) % 3200;
      if (cycle > 3000) {
        eyeH = 3;
        blinkPhase = 1;
      } else blinkPhase = 0;
    }
    return { eyeH, mouthW, mouthH, pupilDy, showBrow, mouth, style, bob };
  }

  function ellipse(x, y, rx, ry, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawCuteEye(x, y, rx, ry, pupilR, pupilDy, lookX) {
    // soft eye white with slight tilt feel via taller bottom
    ellipse(x, y, rx, ry, state.cEye);
    // iris
    const ix = x + lookX;
    const iy = y + pupilDy;
    const g = ctx.createRadialGradient(ix - pupilR * 0.2, iy - pupilR * 0.2, 1, ix, iy, pupilR * 1.2);
    g.addColorStop(0, lighten(state.cPupil, 35));
    g.addColorStop(0.55, state.cPupil);
    g.addColorStop(1, shade(state.cPupil, 35));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(ix, iy, pupilR, pupilR * 1.12, 0, 0, Math.PI * 2);
    ctx.fill();
    // pupil core
    ellipse(ix, iy + 0.5, pupilR * 0.42, pupilR * 0.5, "#1a1230");
    if (el("sparkle").checked && ry > 4) {
      ellipse(ix - pupilR * 0.4, iy - pupilR * 0.45, Math.max(1.4, pupilR * 0.38), Math.max(1.4, pupilR * 0.38), "#fff");
      ellipse(ix + pupilR * 0.35, iy + pupilR * 0.15, Math.max(1, pupilR * 0.2), Math.max(1, pupilR * 0.2), "rgba(255,255,255,0.9)");
    }
  }

  function lighten(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = Math.min(255, (n >> 16) + amt);
    let g = Math.min(255, ((n >> 8) & 255) + amt);
    let b = Math.min(255, (n & 255) + amt);
    return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, "0")}`;
  }
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = Math.max(0, (n >> 16) - amt);
    let g = Math.max(0, ((n >> 8) & 255) - amt);
    let b = Math.max(0, (n & 255) - amt);
    return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, "0")}`;
  }

  function drawMouth(cx, cy, w, h, style, color) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    if (style === "cat_w") {
      // ω style
      ctx.lineWidth = Math.max(2.2, h * 0.35);
      const hw = w * 0.5;
      ctx.beginPath();
      ctx.moveTo(cx - hw, cy - h * 0.15);
      ctx.quadraticCurveTo(cx - hw * 0.55, cy + h * 0.75, cx - hw * 0.12, cy + h * 0.05);
      ctx.quadraticCurveTo(cx, cy - h * 0.35, cx + hw * 0.12, cy + h * 0.05);
      ctx.quadraticCurveTo(cx + hw * 0.55, cy + h * 0.75, cx + hw, cy - h * 0.15);
      ctx.stroke();
      // tiny tongue hint
      ctx.globalAlpha = 0.85;
      ellipse(cx, cy + h * 0.35, Math.max(2, w * 0.12), Math.max(1.5, h * 0.28), lighten(color, 40));
      ctx.globalAlpha = 1;
    } else if (style === "soft_smile") {
      ctx.lineWidth = Math.max(2.4, h * 0.38);
      ctx.beginPath();
      ctx.moveTo(cx - w * 0.5, cy - h * 0.1);
      ctx.quadraticCurveTo(cx, cy + h * 0.95, cx + w * 0.5, cy - h * 0.1);
      ctx.stroke();
      // soft fill under smile
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.moveTo(cx - w * 0.35, cy);
      ctx.quadraticCurveTo(cx, cy + h * 0.7, cx + w * 0.35, cy);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (style === "heart") {
      const s = Math.max(w, h) * 0.55;
      ctx.beginPath();
      ctx.moveTo(cx, cy + s * 0.55);
      ctx.bezierCurveTo(cx - s, cy + s * 0.1, cx - s, cy - s * 0.55, cx, cy - s * 0.15);
      ctx.bezierCurveTo(cx + s, cy - s * 0.55, cx + s, cy + s * 0.1, cx, cy + s * 0.55);
      ctx.fill();
    } else if (style === "dot") {
      ellipse(cx, cy, Math.max(2.5, w * 0.28), Math.max(2, h * 0.35), color);
    } else {
      ellipse(cx, cy, w / 2, h / 2, color);
    }
    ctx.restore();
  }

  function drawPlaceholder(ox, oy, bob) {
    const cx = ox + BODY / 2;
    const cy = oy + BODY / 2 + bob;
    const g = ctx.createRadialGradient(cx - 18, cy - 28, 8, cx, cy, 72);
    g.addColorStop(0, "#ffc8dc");
    g.addColorStop(1, "#f4a0bc");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(cx, cy + 8, 56, 60, 0, 0, Math.PI * 2);
    ctx.fill();
    const ear = (side) => {
      const s = side;
      ctx.fillStyle = "#f4a0bc";
      ctx.beginPath();
      ctx.moveTo(cx + s * 40, cy - 26);
      ctx.lineTo(cx + s * 56, cy - 70);
      ctx.lineTo(cx + s * 16, cy - 46);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#ffd4e4";
      ctx.beginPath();
      ctx.moveTo(cx + s * 38, cy - 30);
      ctx.lineTo(cx + s * 50, cy - 60);
      ctx.lineTo(cx + s * 22, cy - 44);
      ctx.closePath();
      ctx.fill();
    };
    ear(-1); ear(1);
  }

  function drawFrame() {
    const bob = el("anim").checked ? Math.sin((performance.now() - t0) / 700) * 1.4 : 0;
    const lookX = el("anim").checked ? Math.sin((performance.now() - t0) / 1600) * 1.2 : 0;
    const { ox, oy } = bodyOrigin();
    const mood = el("faceMood").value;
    const m = moodMods(mood, bob);

    ctx.clearRect(0, 0, SCREEN, SCREEN);
    ctx.fillStyle = "#202020";
    ctx.fillRect(0, 0, SCREEN, SCREEN);

    if (bodyImg) {
      ctx.drawImage(bodyImg, ox, oy + bob, BODY, BODY);
    } else {
      drawPlaceholder(ox, oy, bob);
    }

    const eyeY = oy + state.eyeY + bob;
    const mouthY = oy + state.mouthY + bob;
    const blushY = oy + state.blushY + bob;
    const cx = ox + BODY / 2;
    const gap = state.eyeGap / 2;

    // blush first (under eyes a bit)
    if (state.blush > 0) {
      ctx.globalAlpha = 0.35;
      ellipse(cx - gap - 2, blushY, state.blush * 1.1, state.blush * 0.55, state.cBlush);
      ellipse(cx + gap + 2, blushY, state.blush * 1.1, state.blush * 0.55, state.cBlush);
      ctx.globalAlpha = 1;
    }

    if (m.showBrow) {
      ctx.fillStyle = "#3a3040";
      ctx.fillRect(cx - gap - 8, eyeY - state.eyeH * 0.7, 16, 3);
      ctx.fillRect(cx + gap - 8, eyeY - state.eyeH * 0.7, 16, 3);
    }

    const erx = state.eyeW / 2;
    const ery = m.eyeH / 2;
    const pr = state.pupil / 2;
    drawCuteEye(cx - gap, eyeY, erx, ery, pr, m.pupilDy, lookX);
    drawCuteEye(cx + gap, eyeY, erx, ery, pr, m.pupilDy, lookX);

    drawMouth(cx, mouthY, m.mouthW, m.mouthH, m.style, m.mouth);

    // drag target hint
    ctx.strokeStyle = "rgba(255,158,200,0.35)";
    ctx.setLineDash([4, 3]);
    if (dragTarget === "eyes") {
      ctx.strokeRect(cx - gap - erx - 3, eyeY - ery - 3, gap * 2 + erx * 2 + 6, ery * 2 + 6);
    } else if (dragTarget === "mouth") {
      ctx.strokeRect(cx - m.mouthW / 2 - 4, mouthY - m.mouthH / 2 - 4, m.mouthW + 8, m.mouthH + 8);
    } else {
      ctx.strokeRect(cx - gap - state.blush - 4, blushY - state.blush * 0.5 - 2, gap * 2 + state.blush * 2 + 8, state.blush + 4);
    }
    ctx.setLineDash([]);

    if (el("anim").checked) requestAnimationFrame(drawFrame);
  }

  function renderSchemes() {
    const box = el("schemes");
    box.innerHTML = "";
    for (const s of SCHEMES) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "scheme" + (s.id === schemeId ? " active" : "");
      b.dataset.id = s.id;
      b.innerHTML = `<span class="name">${s.name}</span><span class="desc">${s.desc}</span>
        <span class="swatch"><i style="background:${s.cEye}"></i><i style="background:${s.cPupil}"></i><i style="background:${s.cMouth}"></i></span>`;
      b.addEventListener("click", () => { applyScheme(s); if (!el("anim").checked) drawFrame(); });
      box.appendChild(b);
    }
  }

  function buildPayload() {
    const s = SCHEMES.find((x) => x.id === schemeId);
    return {
      character: "粉色猫耳娘",
      focus: "可爱 / 灵动",
      scheme_id: schemeId,
      scheme_name: s ? s.name : schemeId,
      face_style: {
        eye_w: state.eyeW, eye_h: state.eyeH, eye_gap: state.eyeGap, pupil: state.pupil,
        mouth_w: state.mouthW, mouth_h: state.mouthH, mouth_style: state.mouthStyle,
        blush: state.blush,
        color_eye: state.cEye, color_pupil: state.cPupil, color_mouth: state.cMouth, color_blush: state.cBlush,
        default_brows: !!state.brow,
      },
      anchors_preview_body160: {
        eye_l: { x: Math.round(BODY / 2 - state.eyeGap / 2), y: state.eyeY },
        eye_r: { x: Math.round(BODY / 2 + state.eyeGap / 2), y: state.eyeY },
        mouth: { x: Math.round(BODY / 2), y: state.mouthY },
        blush_y: state.blushY,
      },
      note: "嘴型建议固件用路径/双圆弧模拟猫唇；锚点以 pet_skin 最终标定为准。",
    };
  }

  function canvasPos(ev) {
    const r = canvas.getBoundingClientRect();
    const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
    const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
    return {
      x: ((clientX - r.left) / r.width) * SCREEN,
      y: ((clientY - r.top) / r.height) * SCREEN,
    };
  }

  function onDrag(ev) {
    if (!dragging) return;
    ev.preventDefault();
    const { ox, oy } = bodyOrigin();
    const p = canvasPos(ev);
    const by = Math.round(p.y - oy);
    if (dragTarget === "eyes") {
      state.eyeY = Math.max(40, Math.min(110, by));
    } else if (dragTarget === "mouth") {
      state.mouthY = Math.max(70, Math.min(140, by));
    } else {
      state.blushY = Math.max(60, Math.min(130, by));
    }
    // horizontal: eyes gap via distance from center / mouth stays centered
    if (dragTarget === "eyes") {
      const cx = ox + BODY / 2;
      const dist = Math.abs(p.x - cx);
      state.eyeGap = Math.max(22, Math.min(58, Math.round(dist * 2)));
    }
    syncUI();
    if (!el("anim").checked) drawFrame();
  }

  screen.addEventListener("pointerdown", (ev) => {
    dragging = true;
    screen.classList.add("dragging");
    screen.setPointerCapture(ev.pointerId);
    onDrag(ev);
  });
  screen.addEventListener("pointermove", onDrag);
  screen.addEventListener("pointerup", () => {
    dragging = false;
    screen.classList.remove("dragging");
  });
  screen.addEventListener("pointercancel", () => {
    dragging = false;
    screen.classList.remove("dragging");
  });

  document.querySelectorAll("[data-drag]").forEach((btn) => {
    btn.addEventListener("click", () => {
      dragTarget = btn.dataset.drag;
      document.querySelectorAll("[data-drag]").forEach((b) => b.classList.toggle("active", b === btn));
      if (!el("anim").checked) drawFrame();
    });
  });

  el("btnResetPos").addEventListener("click", () => {
    const s = SCHEMES.find((x) => x.id === schemeId) || SCHEMES[0];
    state.eyeY = s.eyeY; state.mouthY = s.mouthY; state.blushY = s.blushY; state.eyeGap = s.eyeGap;
    syncUI();
    if (!el("anim").checked) drawFrame();
  });

  el("file").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => { bodyImg = img; URL.revokeObjectURL(url); if (!el("anim").checked) drawFrame(); };
    img.src = url;
  });
  el("btnClear").addEventListener("click", () => {
    bodyImg = null; el("file").value = ""; if (!el("anim").checked) drawFrame();
  });

  ["eyeW","eyeH","eyeGap","pupil","mouthW","mouthH","blush","eyeY","mouthY","blushY",
   "cEye","cPupil","cMouth","cBlush","mouthStyle","faceMood","brows","sparkle"]
    .forEach((id) => el(id).addEventListener("input", () => {
      readUI();
      if (!el("anim").checked) drawFrame();
    }));

  el("anim").addEventListener("change", () => {
    if (el("anim").checked) requestAnimationFrame(drawFrame);
    else drawFrame();
  });

  el("btnPick").addEventListener("click", () => {
    picked = buildPayload();
    el("out").textContent = JSON.stringify(picked, null, 2);
    el("chosenLabel").textContent = `已选定：${picked.scheme_name}`;
  });
  el("btnCopy").addEventListener("click", async () => {
    if (!picked) { picked = buildPayload(); el("out").textContent = JSON.stringify(picked, null, 2); }
    try {
      await navigator.clipboard.writeText(JSON.stringify(picked, null, 2));
      el("chosenLabel").textContent = "已复制 JSON";
    } catch {
      el("chosenLabel").textContent = "复制失败，请手动选择";
    }
  });

  renderSchemes();
  applyScheme(SCHEMES[0]);
  requestAnimationFrame(drawFrame);
})();
</script>
</body>
</html>
